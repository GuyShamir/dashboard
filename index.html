<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>כניסה</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface2:#eef0f4; --line:#dfe3ea; --ink:#16202e; --ink2:#4d5a6c; --muted:#7a8698;
  --accent:#1f6fd0; --accent-ink:#fff; --accent-soft:#e3eefc; --bar:#2f7fdc; --bar-hover:#1558ad;
  --good:#1c7c4a; --danger:#b3261e; --p-google:#2f7fdc; --p-meta:#e07a1f; --p-tiktok:#0f9d8a; --wk:#d7dde7; --s2:#d9772a; --heat:#c2410c; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --surface2:#1f2835; --line:#2b3645; --ink:#e8edf4; --ink2:#b3bfce; --muted:#8593a6;
  --accent:#5aa2f5; --accent-ink:#0b1622; --accent-soft:#1c2f48; --bar:#4d97ee; --bar-hover:#8dbffa;
  --good:#58c08a; --danger:#f2867f; --p-google:#4d97ee; --p-meta:#f0954a; --p-tiktok:#12a594; --wk:#090d13; --s2:#d95926; --heat:#f59a6b; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface2:#1f2835; --line:#2b3645; --ink:#e8edf4; --ink2:#b3bfce; --muted:#8593a6;
  --accent:#5aa2f5; --accent-ink:#0b1622; --accent-soft:#1c2f48; --bar:#4d97ee; --bar-hover:#8dbffa;
  --good:#58c08a; --danger:#f2867f; --p-google:#4d97ee; --p-meta:#f0954a; --p-tiktok:#12a594; --wk:#090d13; --s2:#d95926; --heat:#f59a6b; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Arial Hebrew","Heebo",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* כניסה */
.gate{min-height:100dvh;display:grid;place-items:center;padding:16px}
.gate form{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;box-shadow:var(--shadow);display:grid;gap:14px}
.gate h1{margin:0 0 4px;font-size:20px}
.field{display:grid;gap:5px;font-size:13px;color:var(--ink2)}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:0}

/* מסגרת */
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 18px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.2px;white-space:nowrap}
.mainnav{display:flex;gap:4px}
.mainnav a{padding:7px 14px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:600}
.mainnav a:hover{background:var(--surface2)}
.mainnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.topbar .spacer{flex:1}
.topbar select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.page{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:22px;margin:0 0 16px}
h3{font-size:16px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.empty{color:var(--muted);padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:10px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack{display:grid;gap:16px}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}

/* לקוחות */
.clients{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
.subnav{position:sticky;top:70px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px;max-height:calc(100dvh - 90px);overflow:auto}
.subnav a{padding:8px 12px;border-radius:8px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.subnav a:hover{background:var(--surface2)}
.subnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
/* ארכיון: לקוח שנלחץ אצלו ״ארכיון״ יורד לקבוצה שבסוף תפריט הלקוחות, וחוזר למקום שלו בחצות */
.subnav .archtoggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding:9px 12px 7px;border:0;border-top:1px solid var(--line);background:none;color:var(--muted);font-size:13px;font-weight:600;text-align:start;white-space:nowrap}
.subnav .archtoggle:hover:not(:disabled){color:var(--ink)}
.subnav .archtoggle:disabled{cursor:default;opacity:.7}
.subnav .archtoggle .cnt{background:var(--surface2);border-radius:99px;padding:0 8px;font-weight:600}
.subnav a.arch{color:var(--muted)}
.chead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.chead h2{margin:0;margin-inline-end:4px}
/* פוקוס: מסתיר את התפריט הראשי ואת רשימת הלקוחות, ונשאר רק הלקוח */
body.focus .topbar,body.focus .subnav{display:none}
body.focus .clients{grid-template-columns:minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .label{color:var(--ink2);font-size:13px}
.kpi .value{font-size:28px;font-weight:800;line-height:1.25;margin-top:2px}
.kpi .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.accs{margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
.accs .acc{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px;margin-top:4px}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--bar);border-radius:99px}

/* תרשים */
.chart-scroll{overflow-x:auto;direction:ltr}
.chart-scroll svg{display:block}
.chart-wrap{position:relative}
.bar{fill:var(--bar)}
.col:hover .bar,.col:focus .bar{fill:var(--bar-hover)}
.col{outline:none}
.col .hit{fill:transparent}
.col:hover .hit,.col:focus .hit{fill:var(--surface2)}
.t-count{fill:var(--ink);font-size:11.5px;font-weight:700;text-anchor:middle}
.t-day{fill:var(--ink2);font-size:11px;text-anchor:middle}
.t-day.wk{fill:var(--ink);font-weight:800}
.wkbg{fill:var(--wk)}
table.data tr.wk td{background:var(--wk)}
table.data tr.wk td:first-child{font-weight:700}
.t-price{fill:var(--muted);font-size:10.5px;text-anchor:middle}
.t-axis{fill:var(--muted);font-size:10.5px}
.gridline{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;z-index:3;direction:rtl;box-shadow:var(--shadow)}
.tip b{display:block;margin-bottom:2px}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th{color:var(--ink2);font-weight:600}
details.tbl summary{cursor:pointer;color:var(--ink2);font-size:13px;margin-top:10px}

/* משימות */
.tasks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.task .body{flex:1;min-width:0}
.tasks>li{min-width:0}
.task .title{font-weight:600;overflow-wrap:anywhere}
.task .tnotes{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.task a.tl,.tpanel a.tl,.cact a.tl{color:var(--accent);direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.task .meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.task .meta .late{color:var(--danger);font-weight:600}
.task.done .title{text-decoration:line-through;color:var(--muted);font-weight:400}
.chip{background:var(--surface2);border-radius:99px;padding:1px 9px;color:var(--ink2)}
.chip.shimi{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.you{background:var(--danger);color:#fff;font-weight:600}
.check{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--ink);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.thread{margin-top:8px;display:grid;gap:8px}
.thread summary{cursor:pointer;color:var(--ink2);font-size:13px}
.msg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.msg.shimi{background:var(--accent-soft)}
.msg .who{display:block;font-weight:700;font-size:12.5px;color:var(--ink2);white-space:normal}
.thread textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink)}
/* מסך ״כללי״: ״השיחה עם שימי״ נפתחת בכרטיס ״טבלה״ שליד המשימות (גיא, 25.11.2026) */
.threadbtn{margin-top:8px;border:0;background:none;padding:0;color:var(--ink2);font-size:13px;cursor:pointer;text-align:start}
.threadbtn:hover{color:var(--accent)}
.threadbtn[aria-pressed="true"]{color:var(--accent);font-weight:700}
.tcard{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow-y:auto}
.tpanel{margin-top:0}
.tpanel .title{font-weight:600;overflow-wrap:anywhere}
.tpanel .tnotes{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.tpanel .meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.task.sel{border-color:var(--accent)}
/* מסך ״כללי״: ״משימות״ מתקפל, ומתחתיו ״סוכנים״ שהביצוע שלהם נפתח ב״טבלה״ (גיא, 25.11.2026) */
details.setcard>summary .sumend{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.gagents .agroup h4{margin:0 0 6px;font-size:13px;color:var(--ink2)}
.gagents .agroup+.agroup{margin-top:14px;padding-top:12px}
.gagents ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.gagents .pick{width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;overflow-wrap:anywhere;cursor:pointer}
.gagents .pick:hover{background:var(--surface2)}
.gagents .pick[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.gagents .pick .when{flex:none;font-size:12.5px;font-weight:400;color:var(--muted)}
.tpanel .run{padding:10px 0;border-top:1px solid var(--line)}
.tpanel .run:first-of-type{border-top:0;padding-top:2px}
.tpanel .run .chip{font-size:12px;margin-inline-start:6px}
.tpanel .run p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13.5px}
/* ניהול › מצפן: מטרה ותיעוד פעולות (גיא, 25.11.2026) */
.ideas.goal textarea{min-height:110px}
.addrow input[type=date]{flex:none;min-width:0;width:auto}
.cacts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.cact{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.cact .when{flex:none;color:var(--muted);font-size:12.5px;padding-top:2px;min-width:44px}
.cact .what{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.x{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{background:var(--surface2);color:var(--danger)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,16,26,.5)}
dialog form{display:grid;gap:12px}
dialog h3{margin-bottom:4px}
.row-end{display:flex;gap:8px;justify-content:flex-start;margin-top:4px}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:calc(100vw - 32px);background:var(--danger);color:#fff;padding:10px 16px;border-radius:10px;z-index:20}
.toast.info{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px}
.toast.info button{background:none;border:1px solid currentColor;border-radius:8px;color:inherit;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer;flex:none}

.rangebar{display:flex;align-items:center;gap:4px}
.rangebtn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;padding:5px 12px;text-align:start}
.rangebtn small{color:var(--muted);font-weight:400;font-size:11.5px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.plus{width:30px;height:30px;border-radius:99px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:20px;line-height:1;font-weight:600;display:grid;place-items:center;padding:0 0 2px}
.plus:hover{filter:brightness(1.07)}
.subsec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.subsec h4{margin:0;font-size:14.5px}
.orderbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.noteitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.noteitem .body{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.noteitem .k{font-weight:700}
.noteitem .meta{color:var(--muted);font-size:12.5px}
.noteitem .meta.num{display:block;text-align:right}
.lnk{color:var(--accent);font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.lnk:hover,.lnk:focus-visible{text-decoration:underline}
.syncwarn{border:0;background:none;padding:0 4px;color:#d97706;font-size:20px;line-height:1;cursor:pointer}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
@media (max-width:600px){.cmgr .cid{display:none}}
.setrow select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.ideas textarea{width:100%;min-height:220px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);line-height:1.6}
.ideas textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.ideas .orderbox{margin-top:10px}
.agents ul{list-style:none;margin:0;padding:0}
.agroup+.agroup{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.agroup h4{margin:0 0 8px;font-size:14px;color:var(--accent)}
.agents li{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);line-height:1.5}
.agents li:first-child{border-top:0;padding-top:0}
.agents li span{display:block;color:var(--muted)}
.agents .acl{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink2)}
.cpick{display:grid;gap:10px;max-height:min(52vh,420px);overflow-y:auto;padding:2px}
.cpick label{display:flex;align-items:center;gap:8px;cursor:pointer}
.cpick input{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none}
.cagents{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:18px}
.cagents ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;align-content:start}
.cagents li{display:flex;align-items:center;gap:4px}
.cagents .pick{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-align:start;border:0;background:none;color:var(--ink);border-radius:9px;padding:9px 10px;overflow-wrap:anywhere}
.cagents .pick:hover{background:var(--surface2)}
.cagents .pick[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cagents .pick .when{flex:none;font-size:12.5px;font-weight:400;color:var(--muted)}
.cagents .out{border-inline-start:1px solid var(--line);padding-inline-start:18px;min-width:0}
.cagents .run{padding:12px 0;border-top:1px solid var(--line)}
.cagents .run:first-of-type{border-top:0;padding-top:4px}
.cagents .run p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.skills{list-style:none;margin:0;padding:0}
.skills li{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);line-height:1.5}
.skills li:first-child{border-top:0;padding-top:0}
.skills li span{display:block;color:var(--muted)}
.skills li .cmd{color:var(--ink2);font-size:13px;margin-top:4px}
.skills li .copy{flex:none;padding:4px 12px;border-radius:99px;border:1px solid var(--accent);background:none;color:var(--accent);font-size:13px;font-weight:600}
.skills li .copy:hover{background:var(--accent-soft)}
@media (max-width:760px){.cagents{grid-template-columns:1fr}.cagents .out{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--line);padding-top:14px}}
.accts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.accts li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.accts .plat{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 9px}
.accts .nm{font-weight:600}
.accts .num{color:var(--muted);font-size:13px;margin-inline-start:auto}
.accts .acnote{flex-basis:100%;color:var(--muted);font-size:12.5px}
.accts li.off .nm,.accts li.off .plat{opacity:.6}
.accts .chip{font-size:12px}
.accts .plat.crm{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.accts .plat.link{color:var(--ink2);background:var(--surface2)}
.accts .plat.heatmap{color:var(--heat);background:color-mix(in srgb,var(--heat) 15%,transparent)}
.accts .x{margin-inline-start:4px}
.x.edit{font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details.setcard>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.setcard>summary::-webkit-details-marker{display:none}
details.setcard>summary h3{margin:0}
details.setcard>summary .chev{color:var(--muted);font-size:13px;transition:transform .15s}
details.setcard[open]>summary .chev{transform:rotate(180deg)}
details.setcard>summary .note{margin:0 auto 0 0}

function supaApi(sb) {

  // קיבל 1,000 מתוך 1,543 שורות. כל טבלה שגדלה עם הזמן נטענת כאן בעמודים של 1,000, עד שחוזר עמוד חסר.
  // q() בונה את הבקשה מחדש בכל עמוד, וחייבת לכלול סדר מלא לפי המפתח, אחרת עמודים יכולים לחזור על שורות או לדלג עליהן.
  const pages = async q => { const out = []; for (let i = 0; ; i += 1000) { const r = ok(await q().range(i, i + 999)); out.push(...r); if (r.length < 1000) return out; } };
  return {
    async session() { return !!(await sb.auth.getSession()).data.session; },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signOut() { await sb.auth.signOut(); },
    async clients() { return ok(await sb.from("clients").select("*").eq("active", true).order("sort")); },
    // ניהול לקוחות (26.11.2026): לקוחות שעזבו (active = false), בדיקת מזהה תפוס, והוספת לקוח
    async oldClients() { return ok(await sb.from("clients").select("*").eq("active", false).order("sort")); },
    async clientIdTaken(id) { return ok(await sb.from("clients").select("id").eq("id", id)).length > 0; },
    async addClient(x) { return ok(await sb.from("clients").insert(x).select().single()); },
    async metrics(from, to) { return pages(() => sb.from("daily_metrics").select("*").gte("date", from).lt("date", to).order("date").order("client_id").order("platform")); },
    async metricsFor(id, from, to) { return pages(() => sb.from("daily_metrics").select("*").eq("client_id", id).gte("date", from).lt("date", to).order("date").order("platform")); },
    async firstMetricDate() { const r = ok(await sb.from("daily_metrics").select("date").order("date").limit(1)); return r.length ? r[0].date : today(); },
    async tasks() { return pages(() => sb.from("tasks").select("*").order("created_at").order("id")); },
    async notes() { return pages(() => sb.from("client_notes").select("*").order("created_at").order("id")); },
    async email() { const x = (await sb.auth.getSession()).data.session; return x ? x.user.email : ""; },
    async sync() { return ok(await sb.from("sync_overview").select("*")); },
    async syncStatus() { return ok(await sb.from("sync_status").select("*")); },
    // הגדרות רוחביות (הטבלה app_settings). usd_ils = כמה שקלים לדולר אחד.
    async settings() { return Object.fromEntries(ok(await sb.from("app_settings").select("key,value")).map(x => [x.key, x.value])); },
    async setSetting(key, value) {
      if (value == null) ok(await sb.from("app_settings").delete().eq("key", key));
      else ok(await sb.from("app_settings").upsert({ key, value, updated_at: new Date().toISOString() }));
    },
    async addNote(x) { return ok(await sb.from("client_notes").insert(x).select().single()); },
    async removeNote(id) { ok(await sb.from("client_notes").delete().eq("id", id)); },
    async setSort(id, sort) { ok(await sb.from("clients").update({ sort }).eq("id", id)); },
    async setClient(id, patch) { ok(await sb.from("clients").update(patch).eq("id", id)); },
    async clientAgents(id) { return ok(await sb.from("clients").select("agents").eq("id", id).single()).agents || []; },
    // קריאה טרייה של החשבונות המחוברים, לפני שכותבים את הרשימה מחדש
    async clientAccounts(id) { return ok(await sb.from("clients").select("accounts").eq("id", id).single()).accounts || []; },
    // agent_runs: מה כל סוכן ביצע אצל כל לקוח (קריאה בלבד). ממלא הסוכן דרך ingest_agent_runs.

    // client_skills: הפקודות של הסקילים לכל לקוח (קריאה בלבד, גיא 24.11.2026). נרשם ע"י Claude כשנבנה סקיל חדש.

    async addTask(t) { return ok(await sb.from("tasks").insert(t).select().single()); },

    // בעמודים של 1000: Supabase מחזיר עד 1000 שורות בבקשה, ובחודש אחד יש יותר.
    async campaigns(from, to) { return pages(() => sb.from("campaign_metrics").select("*").gte("date", from).lt("date", to).order("date").order("client_id").order("platform").order("campaign_id")); },
    // campaign_goals: יעד לקמפיין (עלות לתוצאה, תוצאות בחודש). גיא ממלא בכרטיס ״קמפיינים מובילים״.
    async campaignGoals() { return pages(() => sb.from("campaign_goals").select("*").order("client_id").order("platform").order("campaign_id")); },
    // campaign_status (23.11.2026): הסטטוס האחרון שנמשך לכל קמפיין (active / off), בלי קשר לטווח שנבחר
    async campaignStatus() { return pages(() => sb.from("campaign_status").select("*").order("client_id").order("platform").order("campaign_id")); },
    async setCampaignGoal(g) {
      const k = q => q.eq("client_id", g.client_id).eq("platform", g.platform).eq("campaign_id", g.campaign_id);
      if (g.goal_cpl == null && g.goal_results == null) ok(await k(sb.from("campaign_goals").delete()));
      else ok(await sb.from("campaign_goals").upsert({ ...g, updated_at: new Date().toISOString() }));
    },

// צבע לכל פלטפורמה (גיא, 22.11.2026): גוגל כחול, מטא כתום, טיקטוק אפור. הסדר: גם בעמודות (מלמטה למעלה) וגם בשורות הפיצול.
const PORDER = ["google", "meta", "tiktok"];

const usdRate = () => { const v = +state.settings.usd_ils; return v > 0 ? v : null; };
// clients.currencies, למשל {"tiktok":"USD"}: השורות היומיות של הפלטפורמה הזו שמורות בדולרים.
// הדף ממיר אותן לשקלים לפי שער הדולר שבמסך ״הגדרות״. בלי שער הן לא נספרות, והסכום שלהן חוזר ב-usd.
// סוג התוצאה שנספר בכל פלטפורמה. ברירת המחדל: result_type של הלקוח. clients.result_by_platform גובר עליה לפלטפורמה אחת,
// למשל {"google":"conversions"}: בגוגל התוצאות נשמרות תמיד בעמודה conversions (אין שם ״לידים״), ובלי זה גוגל יוצא 0. (22.11.2026)
// לקוח ב-ACC_VIEW נספר תמיד ב״תוצאות״.
const ctype = c => ACC_VIEW[c.id] ? "results" : c.result_type;
const rtOf = (client, platform) => { if (ACC_VIEW[client.id]) return "results"; const v = (client.result_by_platform || {})[platform]; return TYPE[v] ? v : client.result_type; };
function summarize(client, rows) {
  const byDay = new Map(), byPlat = {}, cur = client.currencies || {}, rate = usdRate();
  let spend = 0, n = 0, typed = 0, usd = 0, converted = 0, rev = 0, clicks = 0;  // rev = ערך המרה (daily_metrics.revenue, בגוגל בלבד)
  for (const r of rows) {
    if (r.client_id !== client.id) continue;
    const t = rtOf(client, r.platform);
    let f = 1;
    if (cur[r.platform] === "USD") { if (!rate) { usd += +r.cost; continue; } f = rate; converted += +r.cost; }
    const cost = +r.cost * f, tc = +r[t + "_cost"] * f;
    spend += cost; n += +r[t]; typed += tc; rev += (+r.revenue || 0) * f; clicks += +r.clicks || 0;
    const P = byPlat[r.platform] || (byPlat[r.platform] = { spend: 0, n: 0, typed: 0 });
    P.spend += cost; P.n += +r[t]; P.typed += tc;
    const d = byDay.get(r.date) || { date: r.date, spend: 0, n: 0, typed: 0, p: {} };
    d.spend += cost; d.n += +r[t]; d.typed += tc;
    const dp = d.p[r.platform] || (d.p[r.platform] = { spend: 0, n: 0, typed: 0 });
    dp.spend += cost; dp.n += +r[t]; dp.typed += tc; byDay.set(r.date, d);
  }
  const days = [...byDay.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
  // plats: הפלטפורמות שהייתה בהן הוצאה בטווח, לפי הסדר הקבוע. יותר מאחת = מציגים פיצול בצבעים.
  const plats = PORDER.filter(k => byPlat[k] && byPlat[k].spend > 0);
  return { spend, n, typed, cpl: n > 0 ? typed / n : null, days, usd, converted, byPlat, plats,
    rev, clicks, roas: rev > 0 && spend > 0 ? rev / spend : null, cpc: clicks > 0 ? spend / clicks : null };
}

// לינקים במשימות (גיא, 24.11.2026): כל כתובת בטקסט מוצגת כשם האתר שלה, לחיצה ובטאב חדש. כלל אחד לכל אתר, והטקסט השמור לא משתנה.
// פיסוק בסוף הכתובת (וסוגר שלא נפתח בתוכה) נשאר מחוץ ללינק.
function linkify(text) {
  const out = [], re = /(?:https?:\/\/|(?<![\w@.\/-])www\.)[^\s<>"״”“]+/gi; let at = 0, m;
  while ((m = re.exec(text))) {
    let raw = m[0];
    for (;;) {

      if (/[.,;:!?'׳’]/.test(last) || (last === ")" && raw.split(")").length > raw.split("(").length) || (last === "]" && raw.split("]").length > raw.split("[").length)) raw = raw.slice(0, -1);
      else break;
    }
    const url = cleanUrl(raw); if (!url) continue;
    if (m.index > at) out.push(text.slice(at, m.index));
    out.push(h("a", { class: "tl", href: url, target: "_blank", rel: "noopener noreferrer", title: url }, new URL(url).hostname.replace(/^www\./, "") + " ↗"));
    at = m.index + raw.length;
  }
  if (at < text.length) out.push(text.slice(at));
  return out;
}
// גוף השיחה: ההודעות, תיבת התשובה והכפתורים. משמש את השיחה שנפתחת בתוך המשימה, וגם את הכרטיס ״טבלה״ במסך ״כללי״.

// פלטפורמה בדולרים (clients.currencies) מומרת לפי שער הדולר שבמסך ״הגדרות״. בלי שער היא לא נספרת, והכרטיס אומר את זה.

// כשחוזרים לטאב שהיה ברקע יותר מ-10 דקות, נטענים מחדש הלקוחות, המשימות, השיחות עם שימי והתובנות.
// כך שינוי ששימי עשה, או שנעשה ממכשיר אחר, מופיע בלי רענון, ועריכה לא נשענת על מצב ישן. לא קוטעים הקלדה או חלון פתוח.
let liveAt = Date.now(), liveBusy = false;
const liveIdle = () => { const a = document.activeElement; return !document.querySelector("dialog[open]") && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
async function refreshLive() {
  if (liveBusy || !state.clients.length || !$app.querySelector(".topbar") || !liveIdle()) return;
  liveBusy = true;
  try {
    const [clients, tasks, comments, notes] = await Promise.all([api.clients(), api.tasks(), api.comments(), api.notes()]);
    if (liveIdle() && $app.querySelector(".topbar")) { state.clients = clients; state.tasks = tasks; state.comments = comments; state.notes = notes; liveAt = Date.now(); render(); }
  } catch (e) { console.error(e); }
  liveBusy = false;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - liveAt > 10 * 60 * 1000) refreshLive(); });

/* ===== התחלה ===== */
async function start() {
  if (!(await api.session())) return renderGate();
  $app.replaceChildren(h("div", { class: "gate" }, h("div", { class: "empty", role: "status" }, "טוען את הנתונים…")));  // במקום מסך ריק
  try { await loadAll(); }
  catch (e) { console.error(e); $app.replaceChildren(h("div", { class: "gate" }, h("div", { class: "empty" }, "טעינת הנתונים נכשלה. רענן את הדף, ואם זה חוזר, צא והיכנס מחדש."))); return; }
  render();
}
window.addEventListener("hashchange", () => { if (state.clients.length && $app.querySelector(".topbar")) { render(); document.scrollingElement.scrollTop = 0; } });
(async () => {
  try {
    if (MOCK) { await loadScript("mock.js");
      // mock-config.js (מקומי בלבד): ההגדרות לפי לקוח, ואילו לקוחות מקבלים וובינרים וגוגל אנליטיקס בנתוני הבדיקה
      try { await loadScript("mock-config.js"); window.JD_MOCK.settings = { ...(window.JD_MOCK.settings || {}), client_config: window.JD_MOCK_CONFIG }; } catch (e) {}
      const flag = k => ((window.JD_MOCK_FLAGS || {})[k] || []);
      try { await loadScript("mock-manage.js"); } catch (e) {} try { await loadScript("mock-dallas.js"); } catch (e) {} try { await loadScript("mock-dallas-content.js"); } catch (e) {} try { await loadScript("mock-research.js"); } catch (e) {} try { await loadScript("mock-crm.js"); } catch (e) {} try { await loadScript("mock-campaigns.js"); } catch (e) {}
      try { await loadScript("mock-webinars.js"); for (const c of window.JD_MOCK.clients) c.webinars = flag("webinars").includes(c.id); } catch (e) {}
      try { await loadScript("mock-sites.js"); window.JD_MOCK.settings = { ...(window.JD_MOCK.settings || {}), ...window.JD_MOCK_SITES }; } catch (e) {}
      try { await loadScript("mock-ga.js"); for (const c of window.JD_MOCK.clients) c.ga = flag("ga").includes(c.id); } catch (e) {}
      window.JD_MOCK.crm = window.JD_MOCK_CRM || []; window.JD_MOCK.campaigns = window.JD_MOCK_CAMPAIGNS || []; api = mockApi(); }
    else if (CONFIG.url && CONFIG.key) {
      // החתימה שייכת לגרסה 2.45.4 בדיוק. כשמחליפים גרסה מחליפים גם אותה (openssl dgst -sha384 -binary <קובץ> | openssl base64 -A)
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js", "sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o");
      api = supaApi(window.supabase.createClient(CONFIG.url, CONFIG.key));
    } else { $app.replaceChildren(h("div", { class: "gate" }, h("div", { class: "empty" }, "המערכת עוד לא מחוברת לבסיס הנתונים."))); return; }
    await start();
  } catch (e) { console.error(e); $app.replaceChildren(h("div", { class: "gate" }, h("div", { class: "empty" }, "הדף לא נטען. בדוק את החיבור לאינטרנט ורענן."))); }
})();
</script>
